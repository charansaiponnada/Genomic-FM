[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-genomic"
version = "0.2.0"
description = "Linear-time genomic sequence model with a unified associative memory (persistent motifs + sequence registers)."
authors = [{ name = "Charan Sai Ponnada" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
gpu = ["mamba-ssm>=2.2.2", "causal-conv1d>=1.4.0", "datasets>=2.18",
       "scikit-learn>=1.3", "matplotlib>=3.7", "tqdm>=4.66"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mnemosyne*", "data*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
